# Prometheus configuration for ProSeqGO
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: embedding_api_metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["embedding-api:8000"]

  - job_name: embedding_worker_metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["embedding-worker:8001"]

  - job_name: go_prediction_api_metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["go-prediction-api:8000"]

  - job_name: trainer_api_metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["trainer-api:8000"]

  - job_name: trainer_worker_metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["trainer-worker:8001"]

  - job_name: redis_exporter
    static_configs:
      - targets: ["redis-exporter:9121"]
