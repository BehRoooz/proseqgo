# Integrated stack: Embedding API + GO Prediction API + MLflow + Training API.
# Single public entry: nginx on port 80. Run from repo root: docker compose up --build
# Training API: docker compose --profile training up --build
networks:
  cafa5:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:

services:
  trainer-api:
    build:
      context: .
      dockerfile: docker/docker_training/Dockerfile.training
    image: cafa5-trainer-api:local
    working_dir: /app
    profiles: ["training"]
    networks: [cafa5]
    gpus: all
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      CAFA_DEVICE: auto
      NVIDIA_VISIBLE_DEVICES: all
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Browser URL for MLflow links from GET /api/train/jobs/{id} (via gateway, HTTPS)
      MLFLOW_EXTERNAL_UI_BASE: http://127.0.0.1/mlflow
      REGISTERED_MODEL_NAME: ${REGISTERED_MODEL_NAME}
      PROMOTION_THRESHOLD: ${PROMOTION_THRESHOLD}
    depends_on:
      - mlflow
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./mlruns:/mlruns

  embedding-api:
    build:
      context: .
      dockerfile: docker/docker_embedding/Dockerfile.embedding-api
    image: cafa5-embedding-api:local
    working_dir: /app/services/embedding-api
    networks: [cafa5]
    gpus: all
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app:/app/services/embedding-api
      CAFA_DEVICE: auto
      NVIDIA_VISIBLE_DEVICES: all
      GO_PREDICTION_API_URL: http://go-prediction-api:8000
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - go-prediction-api
      - mlflow
    volumes:
      - ./outputs:/app/outputs
      - ./data/hf_cache:/app/data/hf_cache

  go-prediction-api:
    build:
      context: .
      dockerfile: docker/docker_go_term/Dockerfile.api
    image: cafa5-go-prediction-api:local
    working_dir: /app/services/go-prediction-api
    networks: [cafa5]
    gpus: all
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app:/app/services/go-prediction-api
      CAFA_DEVICE: auto
      NVIDIA_VISIBLE_DEVICES: all
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/cafa-go-model@champion
      MODEL_CACHE_DIR: /app/model_cache
    depends_on:
      - mlflow
    volumes:
      - ./outputs:/app/outputs

  streamlit-ui:
    build:
      context: .
      dockerfile: docker/docker_streamlit/Dockerfile.streamlit
    image: cafa5-streamlit-ui:local
    working_dir: /app/services/streamlit-ui
    networks: [cafa5]
    environment:
      GATEWAY_BASE_URL: http://nginx
    depends_on:
      - embedding-api
      - go-prediction-api 
      - mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    networks: [cafa5]
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri file:///mlruns
      --default-artifact-root file:///mlruns
      --artifacts-destination file:///mlruns
    volumes:
      - ./mlruns:/mlruns

  nginx:
    image: nginx:latest
    networks: [cafa5]
    ports:
      - "80:80"
    #  - "443:443" # HTTPS is not supported yet
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd-admin:/etc/nginx/.htpasswd-admin:ro
      - ./nginx/.htpasswd-user:/etc/nginx/.htpasswd-user:ro
      #- ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - embedding-api
      - go-prediction-api
      - mlflow
      - streamlit-ui

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: ["monitoring"]
    networks: [cafa5]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: ["monitoring"]
    networks: [cafa5]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro