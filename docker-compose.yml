# Integrated stack: Embedding API + GO Prediction API + MLflow + Training API.
# Single public entry: nginx on port 80. Run from repo root: docker compose up --build
# Training API: docker compose --profile training up --build
# Copy .env.example to .env and set secrets before first run.
networks:
  cafa5:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  minio_data:

services:
  postgres:
    image: postgres:16-alpine
    networks: [cafa5]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    networks: [cafa5]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    networks: [cafa5]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/mlflow-artifacts &&
      mc mb --ignore-existing local/mlflow-db-backups &&
      echo 'MinIO buckets ready'
      "
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: docker/docker_mlflow/Dockerfile
    image: cafa5-mlflow:local
    networks: [cafa5]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_IGNORE_TLS: "true"
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root ${MLFLOW_ARTIFACT_ROOT}
      --artifacts-destination ${MLFLOW_ARTIFACT_ROOT}
      --serve-artifacts
    restart: unless-stopped

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    networks: [cafa5]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: ${BACKUP_RETENTION_DAYS}
      BACKUP_KEEP_WEEKS: ${BACKUP_RETENTION_WEEKS}
      BACKUP_DIR: /backups
    volumes:
      - ./backups/postgres:/backups
    restart: unless-stopped

  backup-offload:
    image: minio/mc:latest
    networks: [cafa5]
    depends_on:
      minio:
        condition: service_healthy
      postgres-backup:
        condition: service_started
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      BACKUP_OFFLOAD_TARGET: ${BACKUP_OFFLOAD_TARGET}
      BACKUP_DIR: /backups
      BACKUP_OFFLOAD_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
    volumes:
      - ./backups/postgres:/backups:ro
      - ./scripts/offload_postgres_backup.sh:/offload.sh:ro
    entrypoint: /bin/sh
    command: -c "while true; do /offload.sh; sleep 3600; done"
    restart: unless-stopped

  trainer-api:
    build:
      context: .
      dockerfile: docker/docker_training/Dockerfile.training
    image: cafa5-trainer-api:local
    working_dir: /app
    profiles: ["training"]
    networks: [cafa5]
    gpus: all
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      CAFA_DEVICE: auto
      NVIDIA_VISIBLE_DEVICES: all
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_IGNORE_TLS: "true"
      # Browser URL for MLflow links from GET /api/train/jobs/{id} (via gateway, HTTPS)
      MLFLOW_EXTERNAL_UI_BASE: http://127.0.0.1/mlflow
      REGISTERED_MODEL_NAME: ${REGISTERED_MODEL_NAME}
      PROMOTION_THRESHOLD: ${PROMOTION_THRESHOLD}
    depends_on:
      - mlflow
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs

  embedding-api:
    build:
      context: .
      dockerfile: docker/docker_embedding/Dockerfile.embedding-api
    image: cafa5-embedding-api:local
    working_dir: /app/services/embedding-api
    networks: [cafa5]
    gpus: all
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app:/app/services/embedding-api
      CAFA_DEVICE: auto
      NVIDIA_VISIBLE_DEVICES: all
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_IGNORE_TLS: "true"
      GO_PREDICTION_API_URL: http://go-prediction-api:8000
    depends_on:
      - go-prediction-api
      - mlflow
    volumes:
      - ./outputs:/app/outputs
      - ./data/hf_cache:/app/data/hf_cache

  go-prediction-api:
    build:
      context: .
      dockerfile: docker/docker_go_term/Dockerfile.api
    image: cafa5-go-prediction-api:local
    working_dir: /app/services/go-prediction-api
    networks: [cafa5]
    gpus: all
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app:/app/services/go-prediction-api
      CAFA_DEVICE: auto
      NVIDIA_VISIBLE_DEVICES: all
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_IGNORE_TLS: "true"
      REGISTERED_MODEL_NAME: ${REGISTERED_MODEL_NAME}
      MODEL_URI: models:/${REGISTERED_MODEL_NAME}@champion
      MODEL_CACHE_DIR: /app/model_cache
    depends_on:
      - mlflow
    volumes:
      - ./outputs:/app/outputs

  streamlit-ui:
    build:
      context: .
      dockerfile: docker/docker_streamlit/Dockerfile.streamlit
    image: cafa5-streamlit-ui:local
    working_dir: /app/services/streamlit-ui
    networks: [cafa5]
    environment:
      GATEWAY_BASE_URL: http://nginx
    depends_on:
      - embedding-api
      - go-prediction-api
      - mlflow

  nginx:
    image: nginx:latest
    networks: [cafa5]
    ports:
      - "80:80"
    #  - "443:443" # HTTPS is not supported yet
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd-admin:/etc/nginx/.htpasswd-admin:ro
      - ./nginx/.htpasswd-user:/etc/nginx/.htpasswd-user:ro
      #- ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - embedding-api
      - go-prediction-api
      - mlflow
      - streamlit-ui

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: ["monitoring"]
    networks: [cafa5]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: ["monitoring"]
    networks: [cafa5]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
